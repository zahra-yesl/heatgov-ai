name: tests

# What runs here, and what deliberately does not.
#
# CI covers the two things that are self-contained: the optimizer's unit tests,
# which are pure logic, and the frontend's typecheck, lint and production build.
#
# The other two suites cannot run on a runner and are not pretended to:
#
#   backend/api/test_endpoints.py  (27 checks)
#   frontend/scripts/test-frontend.mjs  (46 checks)
#
# Both need `models/*.pkl` and `data/processed/*.parquet`, which are git-ignored
# because they are large and regenerated by the pipeline, and the frontend suite
# also makes a live Gemini call. Wiring them up would mean committing the model
# artefacts or putting real API keys in repository secrets. Run them locally;
# CONTRIBUTING.md has the commands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  optimizer:
    name: optimizer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only pytest. The optimizer package imports nothing outside the standard
      # library, so installing the full requirements.txt here would add minutes
      # to every run and buy nothing.
      - run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest backend/optimizer/ -v

  frontend:
    name: frontend typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npm run build
